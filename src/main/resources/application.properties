spring.application.name=MicroServiceProject


# ===============================
# MYSQL DATASOURCE
# ===============================
spring.datasource.url=jdbc:mysql://mysql:3306/educatif_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# ENABLE SPRING CLOUD CONFIG
# ===============================
spring.cloud.config.enabled=true
spring.config.import=optional:configserver:http://config-server:8889

#eureka
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka

