# =====================
# Service name
# =====================
spring.application.name=ETUDIANT-SERVICE

# Port
server.port=8081

# =====================
# MySQL Database (Docker)
# =====================
spring.datasource.url=jdbc:mysql://mysql-db:3306/etudiant_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================
# JPA / Hibernate
# =====================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# ===============================
# Spring Cloud Config (Docker)
# ===============================
spring.cloud.config.enabled=true
spring.config.import=optional:configserver:http://config-server:8889

# =====================
# Eureka Client (Docker)
# =====================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka

# =====================
# RabbitMQ (Docker)
# =====================
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# =====================
# Security Keycloak (OAuth2 Resource Server)
# =====================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/EduRealm

# =====================
# Keycloak Client Configuration
# =====================
keycloak.auth-server-url=http://keycloak:8080
keycloak.realm=EduRealm
keycloak.client-id=etudiant-service
keycloak.client-secret=etudiant-secret
# Optionnel : pour autoriser les requêtes sans token vers Swagger et Actuator
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/EduRealm/protocol/openid-connect/certs

# =====================
# Swagger UI
# =====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Permettre l'accès à Swagger  (optionnel)
springdoc.swagger-ui.oauth2-redirect-url=http://localhost:8956/swagger-ui/oauth2-redirect.html