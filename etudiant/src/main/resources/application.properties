# =====================
# Service name
# =====================
spring.application.name=ETUDIANT-SERVICE


# =====================
# MySQL Database
# =====================
spring.datasource.url=jdbc:mysql://mysql:3306/etudiant_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================
# JPA / Hibernate
# =====================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true


# ===============================
# ENABLE SPRING CLOUD CONFIG
# ===============================
spring.cloud.config.enabled=true
spring.config.import=optional:configserver:http://config-server:8889

# =====================
# Eureka Client
# =====================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka

# =====================
# RabbitMQ
# =====================
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest