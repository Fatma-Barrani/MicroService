<!-- BACKDROP -->
<div class="modal-backdrop" (click)="closePopup()"></div>

<!-- MODAL -->
<div class="modal-container">

  <!-- HEADER -->
  <div class="modal-header">
    <div class="modal-header-left">
      <div class="modal-icon">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
      </div>
      <div>
        <h2>Ajouter un enseignant</h2>
        <p class="modal-subtitle">Remplissez les informations du nouveau profil</p>
      </div>
    </div>

    <button class="close-btn" (click)="closePopup()" aria-label="Fermer">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- BODY -->
  <div class="modal-body">

    <div class="form-row">
      <div class="form-group">
        <label for="add-nom">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          Nom
        </label>
        <input
          id="add-nom"
          type="text"
          placeholder="ex : Benali"
          [(ngModel)]="form.nom"
        />
      </div>

      <div class="form-group">
        <label for="add-prenom">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          Prénom
        </label>
        <input
          id="add-prenom"
          type="text"
          placeholder="ex : Karim"
          [(ngModel)]="form.prenom"
        />
      </div>
    </div>

    <div class="form-group">
      <label for="add-email">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        Email
      </label>
      <input
        id="add-email"
        type="email"
        placeholder="ex : k.benali@edu.tn"
        [(ngModel)]="form.email"
      />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="add-telephone">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2.18h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.18 6.18l.95-.95a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          Téléphone
        </label>
        <input
          id="add-telephone"
          type="text"
          placeholder="+216 XX XXX XXX"
          [(ngModel)]="form.telephone"
        />
      </div>

      <div class="form-group">
        <label for="add-specialite">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          Spécialité
        </label>
        <input
          id="add-specialite"
          type="text"
          placeholder="ex : Informatique"
          [(ngModel)]="form.specialite"
        />
      </div>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="modal-footer">
    <button class="btn cancel" (click)="closePopup()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
      Annuler
    </button>

    <button class="btn save" (click)="save()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Ajouter
    </button>
  </div>

</div>
