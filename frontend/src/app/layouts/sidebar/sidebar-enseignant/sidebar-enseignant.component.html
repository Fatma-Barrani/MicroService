<aside class="sb" [class.collapsed]="isCollapsed">

  <div class="sb-head">
    <div class="sb-icon"><i class="ti ti-school"></i></div>
    <div class="sb-wrap">
      <div class="sb-name">EduNetAdmin</div>
      <div class="sb-sub">Espace Enseignant</div>
    </div>
  </div>

  <nav class="sb-nav">
    <a class="sb-a" routerLink="/enseignant/listExamen" routerLinkActive="on">
      <i class="ti ti-layout-dashboard"></i>
      <span class="sb-label">Tableau de bord</span>
    </a>

    <div class="sb-div"></div>
    <span class="sb-sec">Pédagogie</span>

    <a class="sb-a" routerLink="/enseignant/listExamen" routerLinkActive="on">
      <i class="ti ti-file-description"></i>
      <span class="sb-label">Mes examens</span>
      <span class="sb-pill" *ngIf="counts.examens">{{ counts.examens }}</span>
    </a>

    <a class="sb-a" routerLink="/enseignant/cours" routerLinkActive="on">
      <i class="ti ti-book-2"></i>
      <span class="sb-label">Mes cours</span>
      <span class="sb-pill" *ngIf="counts.cours">{{ counts.cours }}</span>
    </a>

    <a class="sb-a" routerLink="/enseignant/examens/add" routerLinkActive="on">
      <i class="ti ti-plus"></i>
      <span class="sb-label">Ajouter examen</span>
    </a>

    <a class="sb-a" routerLink="/enseignant/cours/add" routerLinkActive="on">
      <i class="ti ti-plus"></i>
      <span class="sb-label">Ajouter cours</span>
    </a>

    <div class="sb-div"></div>
    <span class="sb-sec">Administration</span>

    <a class="sb-a" routerLink="/admin/etudiants" routerLinkActive="on">
      <i class="ti ti-users"></i>
      <span class="sb-label">Dossiers Étudiants</span>
    </a>
  </nav>

  <div class="sb-foot">
    <button class="toggle-btn" (click)="toggle()" [title]="isCollapsed ? 'Agrandir' : 'Réduire'">
      <i class="ti ti-chevrons-left"></i>
    </button>
    <div class="sb-user" routerLink="/enseignant/listExamen">
      <div class="av">{{ initiales }}</div>
      <div class="sb-user-info">
        <div class="av-name">{{ enseignant.prenom }} {{ enseignant.nom }}</div>
        <div class="av-role">Enseignant(e)</div>
      </div>
    </div>
  </div>

</aside>
